<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<meta name="description" content="$description$">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <p class="kicker">A modern Fortran tutorial</p>
    <h1>$title$<span class="subtitle">$subtitle$</span></h1>
    <p class="lede">$description$</p>
  </div>
</header>
<div class="layout">
  <nav class="toc" aria-label="Contents">
    <p class="toc-title">Contents</p>
$toc$
  </nav>
  <main class="content">
$body$
  </main>
</div>
<footer class="colophon">
  <p>Built from <code>TUTORIAL.md</code> with <code>make site</code>. Figures drawn from the program output by <code>make_figures.py</code>.</p>
</footer>
<script>
document.querySelectorAll('pre.code').forEach(function (pre) {
  var btn = document.createElement('button');
  btn.className = 'copy';
  btn.type = 'button';
  btn.textContent = 'Copy';
  btn.addEventListener('click', function () {
    var text = pre.querySelector('code').innerText;
    navigator.clipboard.writeText(text).then(function () {
      btn.textContent = 'Copied';
      setTimeout(function () { btn.textContent = 'Copy'; }, 1400);
    });
  });
  pre.parentNode.appendChild(btn);
});
</script>
</body>
</html>
